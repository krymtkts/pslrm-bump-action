name: Bump pslrm lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "38 6 * * 5"
      timezone: "Asia/Tokyo"

concurrency:
  group: bump-pslrm-lockfile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update lockfile and create pull request
        uses: krymtkts/pslrm-bump-action@main
        with:
          project-path: .
          github-token: ${{ github.token }}
