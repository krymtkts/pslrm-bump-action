name: Bump pslrm lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "38 6 * * *"
      timezone: "Asia/Tokyo"

concurrency:
  group: bump-pslrm-lockfile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump (${{ matrix.project_path }})
    strategy:
      fail-fast: false
      matrix:
        project_path:
          - .
          - tests/fixtures/basic-project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Update lockfile and create pull request
        uses: krymtkts/pslrm-bump-action@main
        with:
          project-path: ${{ matrix.project_path }}
          github-token: ${{ github.token }}
